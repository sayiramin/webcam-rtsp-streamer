version: '3.8'

services:
  webcam-streamer:
    build: .
    ports:
      - "8554:8554"  # RTSP port
    devices:
      - /dev/video0:/dev/video0  # Linux webcam device
    volumes:
      - ./config.json:/app/config.json
    environment:
      - DISPLAY=${DISPLAY}
    network_mode: host
    privileged: true
